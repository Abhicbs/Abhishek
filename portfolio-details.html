  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }
    .portfolio-details {
      padding: 0;
      margin: 0;
    }
    .portfolio-details .container {
      max-width: 100vw;
      padding: 0;
      margin: 0;
    }
    .portfolio-details .row {
      display: flex;
      flex-wrap: nowrap;
      gap: 20px;
      margin: 0;
      width: 100vw;
      box-sizing: border-box;
    }
    .portfolio-details .col-lg-8 {
      flex: 1 1 0%;
      max-width: calc(100vw - 360px);
      min-width: 0;
      margin: 0;
      box-sizing: border-box;
      position: relative;
    }
    .portfolio-details .col-lg-4 {
      flex: 0 0 340px;
      max-width: 340px;
      min-width: 300px;
      margin-left: auto;
      margin-right: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
      z-index: 2;
      background: #fff;
    }
    @media (max-width: 1200px) {
      .portfolio-details .col-lg-8 {
        max-width: calc(100vw - 320px);
      }
      .portfolio-details .col-lg-4 {
        flex: 0 0 280px;
        max-width: 280px;
        min-width: 220px;
      }
    }
    @media (max-width: 991px) {
      .portfolio-details .row {
        flex-direction: column;
        gap: 8px;
      }
      .portfolio-details .col-lg-8, .portfolio-details .col-lg-4 {
        max-width: 100vw;
        min-width: 0;
      }
      .portfolio-details .col-lg-4 {
        margin-left: 0;
        margin-right: 0;
        flex: 1 1 0%;
      }
    }
    .excel-viewer {
      width: 100%;
      height: calc(100vh - 80px);
      min-height: 600px;
      border: none;
      background: #fff;
      margin: 0;
      box-shadow: none;
      border-radius: 0;
      transition: none;
      display: block;
      position: relative;
      top: 0;
      overflow-y: auto;
    }
    .portfolio-details-header {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 14px;
      margin-bottom: 0;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
      left: -20px;
      height: 48px;
    }
    .portfolio-details-header-title {
      font-size: 2.1rem;
      font-weight: 700;
      color: #18345C;
      margin-right: auto;
      margin-left: 50px;
      line-height: 1.2;
      display: flex;
      align-items: center;
    }
    .back-button {
      margin: 0;
      padding: 8px 20px;
      background-color: #F7B500;
      color: #18345C;
      text-decoration: none;
      border-radius: 4px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: none;
    }
    .download-button {
      margin: 0;
      padding: 8px 20px;
      background-color: #F7B500;
      color: #18345C;
      text-decoration: none;
      border-radius: 4px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: none;
      font-weight: 600;
    }
    .project-info-box, .project-desc-box {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(24, 52, 92, 0.10);
      padding: 28px 22px 22px 22px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border: 1px solid #f2f2f2;
    }
    .project-info-box {
      flex: 1 1 0%;
      min-height: 0;
      max-height: 25%;
      overflow: auto;
      margin-bottom: 18px;
    }
    .project-desc-box {
      flex: 3 1 0%;
      min-height: 0;
      max-height: 75%;
      overflow: auto;
    }
    .project-info-box h3, .project-desc-box h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-weight: 700;
      color: #18345C;
      letter-spacing: 0.01em;
    }
    .project-desc-box h2 {
      color: #F7B500;
      font-size: 1.5rem;
    }
    .project-info-box ul {
      margin: 0;
      padding-left: 18px;
    }
    .project-info-box li {
      margin-bottom: 6px;
      font-size: 1rem;
    }
    .project-desc-box p {
      color: #555;
      font-size: 1.05rem;
      margin-bottom: 10px;
    }
    .back-button:hover, .download-button:hover {
      color: #fff;
    }
    .graphics-swiper {
      width: 100%;
      height: 80vh;
      margin-top: 0;
      margin-bottom: 0;
    }
    .graphics-swiper .swiper-slide {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(24, 52, 92, 0.10);
      overflow: hidden;
    }
    .graphics-swiper .swiper-slide img {
      width: auto;
      max-width: 90%;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(24, 52, 92, 0.10);
      object-fit: contain;
      transition: transform 0.4s cubic-bezier(.25,.8,.25,1);
    }
    .graphics-swiper .swiper-pagination-bullet {
      background: #ccc;
      opacity: 1;
    }
    .graphics-swiper .swiper-pagination-bullet-active {
      background: #18345C;
    }
    .graphics-swiper .swiper-button-next,
    .graphics-swiper .swiper-button-prev {
      color: #18345C;
    }
  </style>
</head>

<body>
  <main id="main">
    <section id="portfolio-details" class="portfolio-details">
      <div class="container">
        <div class="portfolio-details-header">
          <span class="portfolio-details-header-title" id="main-title">Project Details</span>
          <a href="index.html#portfolio" class="back-button"><i class="bi bi-arrow-left"></i> <strong>Back to Portfolio</strong></a>
          <a id="download-link" class="download-button" download style="display: none;">Download File</a>
        </div>
        <div class="row">
          <div class="col-lg-8">
            <div id="excel-container">
              <iframe id="excel-viewer" class="excel-viewer"></iframe>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="project-info-box">
              <h3 id="project-info-title">Project Information</h3>
              <ul>
                <li><strong>Category</strong>: <span id="project-category">Loading...</span></li>
                <li><strong>Project date</strong>: <span id="project-date">Loading...</span></li>
                <li><strong>Tools used</strong>: <span id="project-tools">Loading...</span></li>
              </ul>
            </div>
            <div class="project-desc-box">
              <h2 id="project-desc-title">About This Project</h2>
              <div id="project-description" style="min-height: 80px;">Loading project details...</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>

  <script>
    // Project data configuration
    const projectData = {
      'upl': {
        title: 'UPL Ltd. Financial Valuation',

        date: 'January 2025',
        tools: 'Excel, Financial Modeling, Prowess IQ, Python, Google suite',
        description: 'I built a <strong>3-statement financial model</strong> & <strong>Debt-to-Equity </strong>schedules for UPL Ltd.,<strong>forecasted revenue</strong> based on assumptions, projected <strong>free cash flows</strong>, and ran a <strong>levered DCF</strong> using an 11.3% WACC to estimate intrinsic value. The analysis included <strong>terminal value</strong> calculations (perpetuity growth and EBITDA multiples) and <strong>sensitivity analysis</strong> on growth/discount rates. I also benchmarked UPL against peers using <strong>EV/EBITDA</strong> and <strong>P/E multiples</strong> , modeled scenarios (base/optimistic/ conservative), and concluded the stock was <strong>undervalued</strong> relative to its <strong>DCF-derived</strong> share price.',
        pdfPath: 'assets/img/portfolio/pdf files/UPL_Ltd_Valuation.pdf'
      },
      'Apple': {

        tools: 'Excel, Statistical Analysis',
        description: 'I built & forecasted a <strong>3-statement operating model</strong> for IndiGo (InterGlobe Aviation Limited); projected <strong>free cash flows</strong> using detailed <strong>revenue drivers</strong> (ASK growth, passenger yield, ancillary revenue) and <strong>cost assumptions</strong> (fuel prices, CASK-ex fuel). Also, performed <strong>ratio analysis</strong>, and <strong>scenario modeling</strong> to assess financial health and growth potential.',
        pdfPath: 'assets/img/portfolio/pdf files/Apple Valuation 1.2 (pdf).pdf'
      },
      'Aspen': {
        title: 'The Aspen (Real Estate Valuation)',
        category: 'Valuation',
        date: 'March 2024',
        tools: 'Excel, Financial Modeling',
        description: 'In this project, I analyzed the financial performance of <strong>Aspen</strong> using key tools such as <strong>common size analysis, trend analysis, and DuPont analysis</strong>. I worked with its balance sheet, income statement, and cash flow statement to understand how the company manages its money. I evaluated key financial ratios such as <strong>ROE, ROCE, debt-equity ratio, and net profit margin</strong>. This helped me assess Aspen\'s profitability, liquidity, and overall financial health in a more practical, hands-on way.',
        pdfPath: 'assets/img/portfolio/pdf files/Aspen.pdf'
      },
      'srf': {
        title: 'Kaynes Technologies - Equity Research Report',
        category: 'Basic Valuation',
        date: 'April 2024',
        tools: 'Excel',
        description: 'I developed a <strong>3-statement financial model</strong> for SRF Ltd., capturing historical performance (2015–2024) and forecasting key metrics like sales, EBITDA, and EPS. The analysis included detailed <strong>ratio analysis</strong> (margins, ROE, ROCE, turnover ratios) and tracked trends in <strong>working capital, profitability, and leverage</strong>. I also calculated regression beta for <strong>market risk assessment</strong> and benchmarked SRF\'s operational and financial efficiency over time, providing a comprehensive view of its financial health and growth trajectory.',
        excelPath: 'https://docs.google.com/spreadsheets/d/1LzzfMQctr0UgkpdLVgF-c7eWnGdmdytJ/edit?usp=sharing&embedded=true',
        downloadId: '1LzzfMQctr0UgkpdLVgF-c7eWnGdmdytJ'
      },
      'innovate': {
        title: 'Innovate 4.0 - 2024',
        category: 'Case Competition',
        date: '2024',
        tools: 'PDF',
        description: 'Innovate 4.0 - 2024: Case competition project report.',
        pdfPath: 'assets/img/portfolio/pdf files/Innovate_4.0.pdf'
      },
      'prosper': {
        title: 'Prosper: Case Competition',
        category: 'Case Competition',
        date: '2024',
        tools: 'PDF',
        description: 'This case competition analyzes India\'s teleconsultation and e-pharmacy markets, projected to reach $5.5 billion with a 31% CAGR. Technical solutions include virtual waiting rooms, reminder systems, cancellation policies, and end-to-end encryption. Key concerns are doctor-patient engagement, data privacy, and high no-show rates. Proposed interventions—analytics-driven overbooking, partnerships with Max Healthcare and Dr Lal Path Labs, and UI/UX improvements—are assessed for investment, impact, and complexity, emphasizing integrated, patient-centric digital health platforms',
        pdfPath: 'assets/img/portfolio/pdf files/prarambh.pdf'
      },
      'aagaaz': {
        title: 'Aagaaz - IIMA',
        category: 'Case Competition',
        date: '2023',
        tools: 'PDF',
        description: 'Prarambh (Kaagazi) targets efficient paper waste management in Delhi, collecting from institutions and corporates, partnering with Green-O-Tech and the Kathputli community. The process includes waste segregation, recycling, and upcycling into eco-friendly products like notebooks and bookmarks. Kaagazi Clubs promote awareness and responsible disposal. Financials detail revenue streams and gross margins, while SWOT and competitor analysis highlight sustainability strengths. The roadmap includes e-commerce, product diversification, and expansion, supporting Sustainable Development Goals and a circular economy.',
        pdfPath: 'assets/img/portfolio/pdf files/aagaaz.pdf'
      },
      'bric': {
        title: 'BRIC Nations Research Paper',
        category: 'Research Report',
        date: '2024',
        tools: 'PDF',
        description: 'Research Paper: Comparative analysis of BRIC nations and the Indian Financial System.',
        pdfPath: 'assets/img/portfolio/pdf files/bric.fin.pdf'
      },
      'edtech': {
        title: 'Ed-Tech Industry Report (2025)',
        category: 'Research Report',
        date: '2025',
        tools: 'PDF',
        description: 'India\'s Ed-tech industry, valued at $7.5 billion in 2024, spans K-12 education, test preparation, Ed-tech SaaS, online certification, skill development, and online discovery. Major players like Byju\'s, Physics Wallah, and Vedantu leverage AI, gamified learning, and adaptive platforms. The sector saw a funding surge during the pandemic, then an 87% decline, but is recovering. Key challenges include high pricing, retention, and doubt resolution; opportunities lie in upskilling, regional content, and B2C models.',
        pdfPath: 'assets/img/portfolio/pdf files/edtech.pdf'
      },
      'pptbric': {
        title: 'BRIC Financial System Presentation',
        category: 'Presentation Report',
        date: '2024',
        tools: 'PDF',
        description: 'PPT Presentation Report: Financial System & Analysis of BRIC nations.',
        pdfPath: 'assets/img/portfolio/pdf files/fmi.bric.pdf'
      },
      'zomato': {
        title: 'Zomato Sales Analysis',
        category: 'Data Analysis',
        date: '2024',
        tools: 'PDF',
        description: 'The Zomato report analyzes order and sales data using metrics like order quantity, order amount, cuisine type, and customer demographics (gender, age group, occupation, marital status). Vegetarian orders dominate, with Chinese and North Indian cuisines rated highest. Top restaurants by sales and detailed transactional data by year, month, and city are presented. Data visualization reveals trends in consumer behavior, average order values, and market segmentation, supporting targeted marketing and operational decisions for Zomato and partners.',
        pdfPath: 'assets/img/portfolio/pdf files/zomato.pdf'
      },
      'powerbi': {
        title: 'Power BI Profitability Project',
        category: 'Data Analysis',
        date: '2024',
        tools: 'PDF',
        description: 'The Power BI dashboard-driven report visualizes profitability across departments (Sales, R&D, HR, IT, Marketing, Operations) and regions (North, South, East, West, Central). Key metrics include total profit margin (80.04%), total revenue, cost per employee, and revenue per employee. North region and Sales department lead in profitability and efficiency. The analysis covers monthly trends, departmental and regional breakdowns, highlighting operational strengths and supporting strategic decisions with advanced data visualization and DAX calculations.',
        pdfPath: 'assets/img/portfolio/pdf files/powerbiproject.pdf'
      },
      'enactus': {
        title: 'Enactus India National Competition',
        category: 'Other',
        date: '2024',
        tools: 'PDF',
        description: 'Enactus India\'s 2024 report features Project Kaagazi, which collects, segregates, and recycles paper waste through Kaagazi Clubs, empowering the Kathputli community in product design and sales. Project Kshitij partners with NGOs to improve infrastructure, address malnutrition, and implement the VAKT Model for primary education. Both projects prioritize sustainable impact, economic empowerment, and responsible consumption, showing measurable results in revenue, water saved, and thousands directly impacted through innovative, eco-friendly business processes.',
        pdfPath: 'assets/img/portfolio/pdf files/enactus_india.pdf'
      },
      'graphics': {
        title: 'My Graphic Designs',
        category: 'Graphic Design',
        date: '2024',
        tools: 'Images',
        description: 'A showcase of my graphic design work, including creativity and skills.',
        isGraphics: true
      }
    };

    // Get URL parameter
    function getUrlParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name) || '';
    }

    // Load project details
    function loadProject() {
      const projectId = getUrlParam('id');
      
      if (!projectId) {
        document.getElementById('project-category').textContent = 'No project selected';
        return;
      }

      const project = projectData[projectId];
      
      if (!project) {
        document.getElementById('main-title').textContent = 'Project Not Found';
        document.getElementById('project-category').textContent = 'Unknown';
        document.getElementById('project-date').textContent = 'N/A';
        document.getElementById('project-tools').textContent = 'N/A';
        document.getElementById('project-description').textContent = 'The requested project could not be found.';
        return;
      }

      // Update title
      document.getElementById('main-title').textContent = project.title;
      document.getElementById('project-info-title').textContent = 'Project Information';
      document.getElementById('project-desc-title').textContent = 'About This Project';

      // Update project info
      document.getElementById('project-category').textContent = project.category;
      document.getElementById('project-date').textContent = project.date;
      document.getElementById('project-tools').textContent = project.tools;
      document.getElementById('project-description').innerHTML = project.description;

      // Handle file display
      const excelViewer = document.getElementById('excel-viewer');
      const downloadLink = document.getElementById('download-link');
      const excelContainer = document.getElementById('excel-container');

      if (project.isGraphics) {
        // Graphics carousel
        excelViewer.style.display = 'none';
        downloadLink.style.display = 'none';
        
        if (!document.getElementById('graphics-swiper')) {
          const swiperDiv = document.createElement('div');
          swiperDiv.id = 'graphics-swiper';
          swiperDiv.className = 'swiper graphics-swiper';
          swiperDiv.innerHTML = `
            <div class="swiper-wrapper">
              <div class="swiper-slide"><img src="assets/img/portfolio/graphics/Date Reveal.png" alt="Graphic 1"></div>
              <div class="swiper-slide"><img src="assets/img/portfolio/graphics/Ticket.png" alt="Graphic 2"></div>
              <div class="swiper-slide"><img src="assets/img/portfolio/graphics/Coming Soon Post Final 1.0.png" alt="Graphic 3"></div>
              <div class="swiper-slide"><img src="assets/img/portfolio/graphics/final 1.00.jpg" alt="Graphic 4"></div>
              <div class="swiper-slide"><img src="assets/img/portfolio/graphics/Final Post MTT.png" alt="Graphic 5"></div>
              <div class="swiper-slide"><img src="assets/img/portfolio/graphics/Instagram post - 1.jpg" alt="Graphic 6"></div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
          `;
          excelContainer.appendChild(swiperDiv);
          
          setTimeout(() => {
            if (typeof Swiper !== 'undefined') {
              new Swiper('#graphics-swiper', {
                loop: true,
                speed: 700,
                slidesPerView: 1,
                spaceBetween: 30,
                centeredSlides: true,
                pagination: { el: '.swiper-pagination', clickable: true },
                navigation: {
                  nextEl: '.swiper-button-next',
                  prevEl: '.swiper-button-prev',
                },
                autoplay: { delay: 3500, disableOnInteraction: false }
              });
            }
          }, 100);
        }
      } else if (project.pdfPath) {
        // PDF file
        excelViewer.style.display = 'block';
        excelViewer.src = project.pdfPath;
        downloadLink.style.display = 'block';
        downloadLink.href = project.pdfPath;
        downloadLink.download = project.pdfPath.split('/').pop();
      } else if (project.excelPath) {
        // Excel/Google Sheets
        excelViewer.style.display = 'block';
        excelViewer.src = project.excelPath;
        downloadLink.style.display = 'block';
        if (project.downloadId) {
          downloadLink.href = `https://docs.google.com/spreadsheets/d/${project.downloadId}/export?format=xlsx`;
        } else {
          downloadLink.href = '#';
        }
      }
    }

    // Initialize when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadProject);
    } else {
      loadProject();
    }
  </script>
</body>
</html>
